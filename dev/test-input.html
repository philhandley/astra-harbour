<!doctype html>
<meta charset="utf-8">
<title>Pointer interaction test</title>
<style>body{margin:0;font:12px monospace}iframe{width:1280px;height:800px;border:0;display:block}</style>
<iframe id="f" src="../index.html?nosw=1"></iframe>
<pre id="out"></pre>
<script type="module">
// Drives the real canvas with pointer events: throw a lifebuoy, drag waves, tip the block, orbit and zoom.
// Run: bash tools/shot.sh input "dev/test-input.html" 1280,1000 90
import { shotReady } from './shotkit.js';
const out = document.getElementById('out');
const log = (...a) => { const s = a.join(' '); console.log('INPUT ' + s); out.textContent += s + '\n'; };
const f = document.getElementById('f');
await new Promise(r => f.addEventListener('load', r, { once: true }));
const w = f.contentWindow;
const errors = [];
w.addEventListener('error', e => errors.push(String(e.message)));
const wait = s => new Promise(r => setTimeout(r, s * 1000));
for (let i = 0; i < 80 && !(w.__app && w.__app.scene && w.__app.harbour); i++) await wait(0.25);
await wait(1.5);
const app = w.__app, scene = app.scene, cv = scene.canvas;
const ev = (type, x, y, extra = {}) => cv.dispatchEvent(new w.PointerEvent(type, { clientX: x, clientY: y, pointerId: extra.id || 1, button: extra.button || 0, buttons: 1, bubbles: true, pointerType: 'mouse', ...extra }));
const drag = async (pts, opts = {}) => {
  ev('pointerdown', pts[0][0], pts[0][1], opts);
  for (const [x, y] of pts.slice(1)) { await wait(0.03); ev('pointermove', x, y, opts); }
  await wait(0.03);
  ev('pointerup', pts[pts.length - 1][0], pts[pts.length - 1][1], opts);
};
let pass = 0, fail = 0;
const check = (name, ok, extra = '') => { if (ok) pass++; else fail++; log(ok ? 'ok  ' : 'FAIL', name, extra); };

// 1. throw a lifebuoy: find one on screen, pick it up, flick it toward the open water
const lb = app.lifebuoys.items[1];
const sp = scene.project([lb.x, lb.y + 0.01, lb.z]);
const before = [lb.x, lb.z];
ev('pointerdown', sp[0], sp[1]);
const picked = lb.held;
for (let k = 1; k <= 8; k++) { await wait(0.025); ev('pointermove', sp[0] - k * 14, sp[1] + k * 6); }
ev('pointerup', sp[0] - 112, sp[1] + 48);
const flew = lb.flying;
await wait(2.5);
check('lifebuoy picked up', picked);
check('lifebuoy thrown', flew);
check('lifebuoy landed and floats', !lb.flying && !lb.held && Math.hypot(lb.x - before[0], lb.z - before[1]) > 0.1, `moved ${Math.hypot(lb.x - before[0], lb.z - before[1]).toFixed(2)}`);

// 2. waves: drag across open water in the basin
const localWaves = () => { let m = 0; for (let x = -1.0; x <= 0.3; x += 0.04) for (let z = 1.3; z <= 2.3; z += 0.04) m += scene.sim.heightAt(x, z) ** 2; return m; };
let pushes = 0;
const orig = scene.sim.disturb.bind(scene.sim);
scene.sim.disturb = (...a) => { pushes++; return orig(...a); };
const e0 = localWaves();
const a = scene.project([-0.9, 0, 1.6]), b = scene.project([0.1, 0, 2.0]);
ev('pointerdown', a[0], a[1]);
log('  pointerdown at water', a.map(v => v.toFixed(0)).join(','), 'mode', app.inputMode, 'ray', JSON.stringify(scene.ray(a[0], a[1])));
for (let i = 1; i < 12; i++) { await wait(0.03); ev('pointermove', a[0] + (b[0] - a[0]) * i / 11, a[1] + (b[1] - a[1]) * i / 11); }
ev('pointerup', b[0], b[1]);
const e1 = localWaves();
scene.sim.disturb = orig;
check('dragging the water makes waves', pushes >= 12 && e1 > e0 * 1.3, `${pushes} pushes, local wave energy ${e0.toExponential(2)} -> ${e1.toExponential(2)}`);

// 3. tip: press the front cut face (below the waterline) and drag down
const face = scene.project([-0.5, -0.6, 2.6]);
ev('pointerdown', face[0], face[1]);
for (let k = 1; k <= 10; k++) { await wait(0.03); ev('pointermove', face[0], face[1] + k * 18); }
await wait(0.4);
const tipped = Math.abs(scene.jel.ax) + Math.abs(scene.jel.az);
ev('pointerup', face[0], face[1] + 180);
check('dragging the side tips the block', tipped > 0.05, `tilt ${tipped.toFixed(3)}`);
await wait(2.0);
check('the block settles back', Math.abs(scene.jel.ax) + Math.abs(scene.jel.az) < 0.03, `tilt now ${(Math.abs(scene.jel.ax) + Math.abs(scene.jel.az)).toFixed(3)}`);

// 4. orbit with a right-drag, zoom with the wheel
const yaw0 = scene.camera.goal.yaw, dist0 = scene.camera.goal.dist;
await drag([[300, 120], [380, 140], [460, 160]], { button: 2 });
check('right-drag orbits', Math.abs(scene.camera.goal.yaw - yaw0) > 0.2, `yaw ${yaw0.toFixed(2)} -> ${scene.camera.goal.yaw.toFixed(2)}`);
cv.dispatchEvent(new w.WheelEvent('wheel', { clientX: 400, clientY: 400, deltaY: -300, bubbles: true, cancelable: true }));
check('wheel zooms', scene.camera.goal.dist < dist0 * 0.9, `dist ${dist0.toFixed(2)} -> ${scene.camera.goal.dist.toFixed(2)}`);

// 5. the panel: horn, feed
w.document.getElementById('bHorn').click();
w.document.getElementById('bFeed').click();
await wait(2.5);
check('no flavour or slider controls on the panel', !w.document.querySelector('[data-flav]') && !w.document.querySelector('input[type=range]'));
check('fed tally counts', Number(w.document.getElementById('tFed').textContent) >= 1);
check('no console errors', errors.length === 0, errors.slice(0, 3).join(' | '));
log(fail ? 'FAIL' : 'PASS', `${pass} passed, ${fail} failed`);
shotReady();
</script>
